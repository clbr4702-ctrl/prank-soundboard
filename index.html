<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soundboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:#050505;
    color:white;
    min-height:100vh;
}

/* HEADER */

.header{
    padding:20px;
    position:sticky;
    top:0;
    background:rgba(0,0,0,.6);
    backdrop-filter:blur(20px);
}

h1{
    text-align:center;
    margin-bottom:10px;
}

input{
    width:100%;
    max-width:600px;
    display:block;
    margin:auto;
    padding:12px;
    border-radius:10px;
    border:none;
    outline:none;
}

/* GRID */

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:10px;
    padding:20px;
}

.btn{
    background:#222;
    padding:15px;
    border-radius:10px;
    cursor:pointer;
    text-align:center;
    transition:.2s;
}

.btn:hover{
    background:#444;
}

.btn.active{
    background:#00ff88;
    color:black;
}
</style>
</head>

<body>

<div class="header">
<h1>🔊 Soundboard</h1>
<input id="search" placeholder="Szukaj dźwięku...">
</div>

<div class="grid" id="grid"></div>

<script>

const grid = document.getElementById("grid");
const search = document.getElementById("search");

let currentAudio = null;

function render(filter=""){

grid.innerHTML = "";

soundFiles
.filter(s => s.toLowerCase().includes(filter.toLowerCase()))
.forEach(file => {

const div = document.createElement("div");
div.className = "btn";

div.textContent = file.replace(".mp3","");

div.onclick = () => {

if(currentAudio){
currentAudio.pause();
currentAudio.currentTime = 0;
}

const audio = new Audio("sounds/" + file);
currentAudio = audio;

audio.play();

div.classList.add("active");

audio.onended = () => {
div.classList.remove("active");
};
};

grid.appendChild(div);

});

}

search.addEventListener("input", e=>{
render(e.target.value);
});

render();

</script>

</body>
</html>
